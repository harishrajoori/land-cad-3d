<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Web3D Architectural & CAD Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body class="overflow-hidden m-0 p-0 bg-gray-900 text-white font-sans antialiased selection:bg-blue-500/30">
    <!-- Labels Overlay for 3D Text -->
    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>
    
    <!-- Three.js Canvas -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Walk-mode overlay (click to start / controls hint) -->
    <div id="walk-overlay" class="absolute inset-0 z-30 hidden flex-col items-center justify-center bg-black/60 backdrop-blur-sm cursor-pointer select-none">
        <div class="text-center px-6">
            <p class="text-2xl font-bold text-white">Click to walk through</p>
            <p class="mt-3 text-sm text-gray-300">Move: <span class="font-mono bg-gray-800 px-2 py-0.5 rounded">W A S D</span> or arrow keys &nbsp;·&nbsp; Look: move mouse &nbsp;·&nbsp; Run: <span class="font-mono bg-gray-800 px-2 py-0.5 rounded">Shift</span></p>
            <p class="mt-1 text-sm text-gray-400">Press <span class="font-mono bg-gray-800 px-2 py-0.5 rounded">Esc</span> to release the mouse</p>
        </div>
    </div>
    <!-- Crosshair shown while walking -->
    <div id="crosshair" class="absolute left-1/2 top-1/2 z-20 hidden -translate-x-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-white/70 pointer-events-none"></div>

    <!-- UI Config Panel Drawer -->
    <div id="ui-panel" class="absolute top-4 right-4 w-80 max-w-[90vw] bg-gray-900/80 backdrop-blur-md border border-gray-700 p-5 rounded-2xl shadow-2xl flex flex-col gap-5 max-h-[90vh] overflow-y-auto z-20 transition-transform">
        <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Web3D Arch Viewer</h1>
            <p class="text-xs text-gray-400 mt-1">Parametric CAD & Vaastu Engine</p>
        </div>

        <!-- View Mode -->
        <div class="space-y-2">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">View Mode</h2>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-mode-dollhouse" class="py-2 rounded-lg text-sm font-semibold transition-colors bg-blue-600 text-white">Dollhouse</button>
                <button id="btn-mode-walk" class="py-2 rounded-lg text-sm font-semibold transition-colors bg-gray-700 text-gray-300 hover:bg-gray-600">Walk Through</button>
            </div>
        </div>
        
        <!-- Plot Dimensions -->
        <div class="space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">Plot Dimensions (ft)</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Front (South)</label>
                    <input id="in-front" type="number" step="0.1" value="81.0" class="w-full bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Rear (North)</label>
                    <input id="in-rear" type="number" step="0.1" value="78.25" class="w-full bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Left (West)</label>
                    <input id="in-left" type="number" step="0.1" value="52.0" class="w-full bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Right (East)</label>
                    <input id="in-right" type="number" step="0.1" value="48.0" class="w-full bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors">
                </div>
            </div>
        </div>
        
        <!-- Facing & Vaastu Layout -->
        <div class="space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">Facing & Vaastu</h2>
            <div>
                <label class="text-xs text-gray-400 block mb-1">Front of plot faces</label>
                <select id="in-facing" class="w-full bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-purple-400 outline-none transition-colors">
                    <option value="N">North</option>
                    <option value="E">East</option>
                    <option value="S" selected>South</option>
                    <option value="W">West</option>
                </select>
            </div>
            <label class="flex items-center space-x-3 cursor-pointer group">
                <input id="toggle-vaastu-layout" type="checkbox" checked class="form-checkbox h-4 w-4 text-purple-500 rounded border-gray-600 bg-gray-800 focus:ring-purple-500 focus:ring-offset-gray-900 transition-colors">
                <span class="text-sm text-gray-300 group-hover:text-white transition-colors">Auto-place rooms per Vaastu</span>
            </label>
        </div>

        <!-- Green Zone Area -->
        <div class="space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1 flex justify-between">
                <span>Green Zone</span>
                <span class="text-emerald-400 normal-case"><span id="val-green">1080</span> sq.ft</span>
            </h2>
            <input id="in-green" type="range" min="0" max="3000" step="10" value="1080" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
        </div>
        
        <!-- Vaastu & Inspection Layers -->
        <div class="space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">Layers & Views</h2>
            <div class="flex flex-col gap-2.5">
                <label class="flex items-center space-x-3 cursor-pointer group">
                    <input id="toggle-vaastu" type="checkbox" class="form-checkbox h-4 w-4 text-purple-500 rounded border-gray-600 bg-gray-800 focus:ring-purple-500 focus:ring-offset-gray-900 transition-colors">
                    <span class="text-sm text-gray-300 group-hover:text-white transition-colors">16-Zone Vaastu Chakra</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer group">
                    <input id="toggle-grid" type="checkbox" class="form-checkbox h-4 w-4 text-blue-500 rounded border-gray-600 bg-gray-800 focus:ring-blue-500 focus:ring-offset-gray-900 transition-colors">
                    <span class="text-sm text-gray-300 group-hover:text-white transition-colors">Structural Column Grid</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer group">
                    <input id="toggle-cutaway" type="checkbox" checked class="form-checkbox h-4 w-4 text-orange-500 rounded border-gray-600 bg-gray-800 focus:ring-orange-500 focus:ring-offset-gray-900 transition-colors">
                    <span class="text-sm text-gray-300 group-hover:text-white transition-colors">3D Dollhouse Cutaway</span>
                </label>
            </div>
        </div>
        
        <!-- Saved Land Models -->
        <div class="space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">Land Models</h2>
            <div class="flex gap-2">
                <input id="in-model-name" type="text" placeholder="Plot name (e.g. 33x60 East)" class="flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 outline-none transition-colors">
                <button id="btn-save" title="Save model" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition-transform active:scale-95">Save</button>
            </div>
            <div class="flex gap-2">
                <select id="sel-models" class="flex-1 bg-gray-800 rounded-lg px-3 py-1.5 text-sm border border-gray-600 focus:border-blue-400 outline-none transition-colors">
                    <option value="">— Load saved model —</option>
                </select>
                <button id="btn-delete" title="Delete selected" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-500 rounded-lg text-sm font-semibold transition-transform active:scale-95">Del</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-export-json" title="Download this model as .json to commit to your repo" class="py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold transition-transform active:scale-95">Export .json</button>
                <button id="btn-import-json" title="Load a .json model file" class="py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold transition-transform active:scale-95">Import .json</button>
            </div>
            <input id="in-import-file" type="file" accept="application/json,.json" class="hidden">
            <p id="model-status" class="text-xs text-gray-500 h-4"></p>
        </div>

        <!-- Exports for discussion -->
        <div class="space-y-2">
            <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold border-b border-gray-700 pb-1">Exports</h2>
            <button id="btn-export" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-lg text-sm font-semibold shadow-lg shadow-blue-900/20 transition-transform active:scale-[0.98] flex justify-center items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Engineer CAD (.DXF)
            </button>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-export-engineer" title="Dimensioned summary sheet for your engineer" class="py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold transition-transform active:scale-95">Engineer Sheet</button>
                <button id="btn-export-vaastu" title="Vaastu placement & compliance report" class="py-2 bg-purple-700 hover:bg-purple-600 rounded-lg text-xs font-semibold transition-transform active:scale-95">Vaastu Report</button>
            </div>
            <button id="btn-snapshot" title="Save the current 3D view as a PNG image" class="w-full py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold transition-transform active:scale-95">Save View as Image (.png)</button>
        </div>
    </div>

    <script>
        // State
        const config = {
            front: 81.0,
            rear: 78.25,
            left: 52.0,
            right: 48.0,
            greenArea: 1080,
            showVaastu: false,
            showGrid: false,
            cutaway: true,
            facing: 'S',        // direction the FRONT of the plot faces: 'N' | 'E' | 'S' | 'W'
            vaastuStrict: true  // true = place rooms by Vaastu; drives the auto-layout
        };

        let scene, camera, renderer, controls;
        let sceneElements = [];
        let htmlLabels = [];
        let plotPoints = [];
        let centroid = {x: 0, y: 0};
        let roomsData = [];
        let columnsData = [];

        // ---- Vaastu layout engine (Phase 3) ----
        // Each room targets an absolute compass zone on a 3x3 grid.
        // grid zone codes: NW N NE / W C E / SW S SE
        // Sources (traditional Vastu Purush Mandala): pooja=NE, kitchen=SE,
        // master=SW, entrance/living=N or E, toilets=NW/W, center kept light.
        const VAASTU_ROOMS = [
            { key: 'pooja',   name: 'Pooja',        zone: 'NE', floor: 'tile',   furniture: 'mandir' },
            { key: 'kitchen', name: 'Kitchen',      zone: 'SE', floor: 'tile',   furniture: 'kitchen' },
            { key: 'master',  name: 'Master Bed',   zone: 'SW', floor: 'carpet', furniture: 'bed' },
            { key: 'living',  name: 'Living / Hall',zone: 'N',  floor: 'tile',   furniture: 'sofa' },
            { key: 'bed2',    name: 'Bedroom 2',    zone: 'W',  floor: 'carpet', furniture: 'bed' },
            { key: 'bed3',    name: 'Bedroom 3',    zone: 'E',  floor: 'carpet', furniture: 'bed' },
            { key: 'dining',  name: 'Dining',       zone: 'S',  floor: 'wood',   furniture: null },
            { key: 'bath',    name: 'Bath / Utility',zone: 'NW', floor: 'tile',  furniture: null },
            { key: 'foyer',   name: 'Foyer (open)', zone: 'C',  floor: 'wood',   furniture: null }
        ];

        // Compass zone -> (row i, col j) on the local grid, given which way the front faces.
        // Local grid (before facing rotation): i=0 is FRONT row, i=2 is REAR row,
        // j=0 is LEFT col, j=2 is RIGHT col.
        // We define the absolute layout for a SOUTH-facing plot (front = south), then
        // rotate the zone by the facing so the same room lands in the right absolute corner.
        const ZONE_TO_CELL_SOUTH = {
            // for south-facing: front(i=0)=South, rear(i=2)=North, left(j=0)=West, right(j=2)=East
            'SW': [0, 0], 'S': [0, 1], 'SE': [0, 2],
            'W':  [1, 0], 'C': [1, 1], 'E':  [1, 2],
            'NW': [2, 0], 'N': [2, 1], 'NE': [2, 2]
        };

        // Rotate a compass zone by the facing direction relative to south.
        // Turning the facing rotates every zone the same way so the grid stays consistent.
        const COMPASS_ORDER = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        function rotateZone(zone, facing) {
            if (zone === 'C') return 'C';
            // Steps to rotate: south is our reference. Each 90° change of facing rotates zones by 2 steps.
            const facingSteps = { 'S': 0, 'E': 2, 'N': 4, 'W': 6 }; // verified against cell->absolute test
            const shift = facingSteps[facing] || 0;
            const idx = COMPASS_ORDER.indexOf(zone);
            if (idx < 0) return zone;
            return COMPASS_ORDER[(idx + shift) % 8];
        }

        function zoneToCell(zone, facing) {
            const rotated = rotateZone(zone, facing);
            return ZONE_TO_CELL_SOUTH[rotated];
        }

        // ---- Walkthrough state (Phase 2) ----
        let viewMode = 'dollhouse';          // 'dollhouse' | 'walk'
        let pointerControls = null;          // THREE.PointerLockControls
        let wallBoxes = [];                  // THREE.Box3[] used for collision in walk mode
        const clock = new THREE.Clock();
        const EYE_HEIGHT = 5.5;              // feet
        const PLAYER_RADIUS = 1.2;           // feet, collision buffer around the camera
        const move = { forward: false, back: false, left: false, right: false, run: false };
        const walkVelocity = new THREE.Vector3();

        init();

        function init() {
            // Setup Three.js
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x111827, 0.002);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(40, 150, 80);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(40, 0, -40);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -100;
            dirLight.shadow.camera.right = 100;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -100;
            scene.add(dirLight);

            // Ground Plane (Infinite)
            const groundGeom = new THREE.PlaneGeometry(2000, 2000);
            groundGeom.rotateX(-Math.PI / 2);
            const groundMat = new THREE.MeshStandardMaterial({color: 0x1f2937, roughness: 1.0});
            const ground = new THREE.Mesh(groundGeom, groundMat);
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            attachEvents();
            updatePlot();
            animate();
        }

        function attachEvents() {
            const inputs = ['front', 'rear', 'left', 'right'];
            inputs.forEach(id => {
                document.getElementById(`in-${id}`).addEventListener('change', e => {
                    const val = parseFloat(e.target.value);
                    if (!isNaN(val) && val > 0) {
                        config[id] = val;
                        updatePlot();
                    }
                });
            });

            document.getElementById('in-green').addEventListener('input', e => {
                config.greenArea = parseFloat(e.target.value);
                document.getElementById('val-green').innerText = config.greenArea;
                updatePlot();
            });

            document.getElementById('toggle-vaastu').addEventListener('change', e => {
                config.showVaastu = e.target.checked;
                updatePlot();
            });

            document.getElementById('toggle-grid').addEventListener('change', e => {
                config.showGrid = e.target.checked;
                updatePlot();
            });

            document.getElementById('in-facing').addEventListener('change', e => {
                config.facing = e.target.value;
                updatePlot();
            });

            document.getElementById('toggle-vaastu-layout').addEventListener('change', e => {
                config.vaastuStrict = e.target.checked;
                updatePlot();
            });

            document.getElementById('toggle-cutaway').addEventListener('change', e => {
                config.cutaway = e.target.checked;
                updatePlot();
            });

            document.getElementById('btn-export').addEventListener('click', exportDXF);
            document.getElementById('btn-export-engineer').addEventListener('click', exportEngineerSheet);
            document.getElementById('btn-export-vaastu').addEventListener('click', exportVaastuReport);
            document.getElementById('btn-snapshot').addEventListener('click', saveSnapshot);

            // View mode (Phase 2)
            document.getElementById('btn-mode-dollhouse').addEventListener('click', () => setViewMode('dollhouse'));
            document.getElementById('btn-mode-walk').addEventListener('click', () => setViewMode('walk'));

            // Land model persistence
            document.getElementById('btn-save').addEventListener('click', saveModel);
            document.getElementById('btn-delete').addEventListener('click', deleteModel);
            document.getElementById('sel-models').addEventListener('change', e => loadModel(e.target.value));
            document.getElementById('btn-export-json').addEventListener('click', exportModelJSON);
            document.getElementById('btn-import-json').addEventListener('click', () => document.getElementById('in-import-file').click());
            document.getElementById('in-import-file').addEventListener('change', importModelJSON);

            refreshModelList();

            window.addEventListener('resize', onWindowResize);
        }

        // ---------- Land Model Persistence (Phase 1) ----------
        const STORAGE_KEY = 'landCad3d.models';
        const MODEL_VERSION = 1;

        function getStoredModels() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) {
                console.warn('Could not parse saved models', e);
                return {};
            }
        }

        function setStoredModels(models) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(models));
        }

        function setStatus(msg, isError) {
            const el = document.getElementById('model-status');
            el.innerText = msg;
            el.className = `text-xs h-4 ${isError ? 'text-red-400' : 'text-emerald-400'}`;
            clearTimeout(setStatus._t);
            setStatus._t = setTimeout(() => { el.innerText = ''; }, 4000);
        }

        // A model captures everything needed to reproduce the design.
        function serializeModel(name) {
            return {
                schema: 'land-cad-3d/model',
                version: MODEL_VERSION,
                name: name,
                savedAt: new Date().toISOString(),
                config: { ...config }
            };
        }

        function applyModel(model) {
            if (!model || !model.config) return false;
            const c = model.config;
            // Only copy known keys so an old/foreign file can't inject junk.
            ['front', 'rear', 'left', 'right', 'greenArea'].forEach(k => {
                if (typeof c[k] === 'number' && !isNaN(c[k])) config[k] = c[k];
            });
            ['showVaastu', 'showGrid', 'cutaway', 'vaastuStrict'].forEach(k => {
                if (typeof c[k] === 'boolean') config[k] = c[k];
            });
            if (['N', 'E', 'S', 'W'].includes(c.facing)) config.facing = c.facing;
            syncInputsFromConfig();
            updatePlot();
            return true;
        }

        // Push current config values back into the UI controls.
        function syncInputsFromConfig() {
            document.getElementById('in-front').value = config.front;
            document.getElementById('in-rear').value = config.rear;
            document.getElementById('in-left').value = config.left;
            document.getElementById('in-right').value = config.right;
            document.getElementById('in-green').value = config.greenArea;
            document.getElementById('val-green').innerText = config.greenArea;
            document.getElementById('toggle-vaastu').checked = config.showVaastu;
            document.getElementById('toggle-grid').checked = config.showGrid;
            document.getElementById('toggle-cutaway').checked = config.cutaway;
            document.getElementById('in-facing').value = config.facing;
            document.getElementById('toggle-vaastu-layout').checked = config.vaastuStrict;
        }

        function refreshModelList(selectedName) {
            const sel = document.getElementById('sel-models');
            const models = getStoredModels();
            const names = Object.keys(models).sort();
            sel.innerHTML = '<option value="">— Load saved model —</option>';
            names.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                const when = models[n].savedAt ? new Date(models[n].savedAt).toLocaleDateString() : '';
                opt.innerText = when ? `${n}  (${when})` : n;
                sel.appendChild(opt);
            });
            if (selectedName) sel.value = selectedName;
        }

        function saveModel() {
            const name = document.getElementById('in-model-name').value.trim();
            if (!name) { setStatus('Enter a plot name first.', true); return; }
            const models = getStoredModels();
            const existed = !!models[name];
            models[name] = serializeModel(name);
            setStoredModels(models);
            refreshModelList(name);
            setStatus(existed ? `Updated "${name}".` : `Saved "${name}".`);
        }

        function loadModel(name) {
            if (!name) return;
            const models = getStoredModels();
            const model = models[name];
            if (!model) { setStatus(`"${name}" not found.`, true); return; }
            if (applyModel(model)) {
                document.getElementById('in-model-name').value = name;
                setStatus(`Loaded "${name}".`);
            } else {
                setStatus(`Could not load "${name}".`, true);
            }
        }

        function deleteModel() {
            const name = document.getElementById('sel-models').value;
            if (!name) { setStatus('Select a saved model to delete.', true); return; }
            const models = getStoredModels();
            delete models[name];
            setStoredModels(models);
            refreshModelList();
            setStatus(`Deleted "${name}".`);
        }

        // Export the current design as a .json file to commit into the repo (models/ folder).
        function exportModelJSON() {
            const name = document.getElementById('in-model-name').value.trim() || 'land-model';
            const data = JSON.stringify(serializeModel(name), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safe = name.replace(/[^a-z0-9\-_]+/gi, '_').toLowerCase();
            a.href = url;
            a.download = `${safe}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus(`Exported ${safe}.json — commit it to models/ for review.`);
        }

        function importModelJSON(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const model = JSON.parse(reader.result);
                    if (model.schema !== 'land-cad-3d/model') {
                        setStatus('Not a valid land model file.', true);
                        return;
                    }
                    if (applyModel(model)) {
                        const name = model.name || file.name.replace(/\.json$/i, '');
                        document.getElementById('in-model-name').value = name;
                        // Also stash it into localStorage so it appears in the list.
                        const models = getStoredModels();
                        models[name] = { ...model, name };
                        setStoredModels(models);
                        refreshModelList(name);
                        setStatus(`Imported "${name}".`);
                    }
                } catch (err) {
                    setStatus('Could not read that file.', true);
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // allow re-importing the same file
        }
        // ------------------------------------------------------

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function clearScene() {
            sceneElements.forEach(el => {
                scene.remove(el);
                if (el.geometry) el.geometry.dispose();
                if (el.material) {
                    if (Array.isArray(el.material)) el.material.forEach(m => m.dispose());
                    else el.material.dispose();
                }
                if (el.isGroup) {
                    el.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                            else child.material.dispose();
                        }
                    });
                }
            });
            sceneElements = [];

            const container = document.getElementById('labels-container');
            if (container) container.innerHTML = '';
            htmlLabels = [];
        }

        function addHtmlLabel(text, pos, className) {
            const el = document.createElement('div');
            el.className = `absolute text-center whitespace-nowrap px-2 py-1 rounded-md text-xs font-semibold backdrop-blur-md shadow-lg border transform -translate-x-1/2 -translate-y-1/2 transition-opacity ${className}`;
            el.innerText = text;
            document.getElementById('labels-container').appendChild(el);
            htmlLabels.push({ el, pos });
        }

        function calculatePlot(f, r, l, ri) {
            const d_sq = f*f + l*l;
            const d = Math.sqrt(d_sq);
            
            if (r + ri < d || r + d < ri || ri + d < r) {
                alert("Invalid plot dimensions: cannot form a closed polygon with these sides.");
                return null;
            }
            
            const a = r;
            const b = ri;
            const c = d;
            
            const angle_C4_C2 = Math.atan2( -l, f ); 
            const cos_theta = (a*a + c*c - b*b) / (2 * a * c);
            const theta = Math.acos(cos_theta);
            
            // C3 is CCW from C4->C2
            const angle_C4_C3 = angle_C4_C2 + theta;
            const x3 = 0 + a * Math.cos(angle_C4_C3);
            const y3 = l + a * Math.sin(angle_C4_C3);
            
            return [
                {x: 0, y: 0},     // C1: Front-Left (South-West)
                {x: f, y: 0},     // C2: Front-Right (South-East)
                {x: x3, y: y3},   // C3: Rear-Right (North-East)
                {x: 0, y: l}      // C4: Rear-Left (North-West)
            ];
        }

        function calculateCentroid(pts) {
            let cx = 0, cy = 0, a = 0;
            for (let i = 0; i < pts.length; i++) {
                const p1 = pts[i];
                const p2 = pts[(i + 1) % pts.length];
                const cross = p1.x * p2.y - p2.x * p1.y;
                a += cross;
                cx += (p1.x + p2.x) * cross;
                cy += (p1.y + p2.y) * cross;
            }
            a *= 0.5;
            if (a === 0) return {x: 0, y: 0};
            return {x: cx / (6 * a), y: cy / (6 * a)};
        }

        function pointInPoly(pt, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i].x, yi = poly[i].y;
                let xj = poly[j].x, yj = poly[j].y;
                let intersect = ((yi > pt.y) != (yj > pt.y))
                    && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function updatePlot() {
            clearScene();
            
            plotPoints = calculatePlot(config.front, config.rear, config.left, config.right);
            if (!plotPoints) return;
            centroid = calculateCentroid(plotPoints);
            
            buildMeshes();
        }

        function buildMeshes() {
            // 1. Plot Base
            const shape = new THREE.Shape();
            shape.moveTo(plotPoints[0].x, plotPoints[0].y);
            for(let i=1; i<plotPoints.length; i++){
                shape.lineTo(plotPoints[i].x, plotPoints[i].y);
            }
            const geom = new THREE.ShapeGeometry(shape);
            geom.rotateX(-Math.PI / 2);
            const mat = new THREE.MeshStandardMaterial({color: 0x374151, side: THREE.DoubleSide, roughness: 0.9}); 
            const plotMesh = new THREE.Mesh(geom, mat);
            plotMesh.receiveShadow = true;
            scene.add(plotMesh);
            sceneElements.push(plotMesh);

            // 2. Green Zone
            const C1 = plotPoints[0], C2 = plotPoints[1], C3 = plotPoints[2], C4 = plotPoints[3];
            const l_len = Math.hypot(C1.x - C4.x, C1.y - C4.y);
            const ri_len = Math.hypot(C2.x - C3.x, C2.y - C3.y);
            const r_len = Math.hypot(C3.x - C4.x, C3.y - C4.y);
            
            const d = config.greenArea / r_len;
            const safe_d = Math.min(d, Math.min(l_len, ri_len) * 0.9);
            
            const C4p = { x: C4.x + (C1.x - C4.x) * (safe_d/l_len), y: C4.y + (C1.y - C4.y) * (safe_d/l_len) };
            const C3p = { x: C3.x + (C2.x - C3.x) * (safe_d/ri_len), y: C3.y + (C2.y - C3.y) * (safe_d/ri_len) };
            
            if (config.greenArea > 0 && safe_d > 0) {
                const greenShape = new THREE.Shape();
                greenShape.moveTo(C4p.x, C4p.y);
                greenShape.lineTo(C3p.x, C3p.y);
                greenShape.lineTo(C3.x, C3.y);
                greenShape.lineTo(C4.x, C4.y);
                const greenGeom = new THREE.ShapeGeometry(greenShape);
                greenGeom.rotateX(-Math.PI / 2);
                
                const greenMat = new THREE.MeshStandardMaterial({color: 0x2f855a, roughness: 1.0, side: THREE.DoubleSide}); 
                const greenMesh = new THREE.Mesh(greenGeom, greenMat);
                greenMesh.position.y = 0.05; 
                greenMesh.receiveShadow = true;
                scene.add(greenMesh);
                sceneElements.push(greenMesh);
            }

            // 3. Real Home Generation Engine (Walls, Floors, Furniture)
            const pad = 4;
            const bMinX = Math.min(C1.x, C4p.x) + pad;
            const bMaxX = Math.max(C2.x, C3p.x) - pad;
            const bMinY = Math.min(C1.y, C2.y) + pad;
            const bMaxY = Math.min(C4p.y, C3p.y) - pad;
            
            const W = Math.max(0.1, bMaxX - bMinX);
            const H = Math.max(0.1, bMaxY - bMinY);
            
            const houseGroup = new THREE.Group();
            houseGroup.position.set(bMinX, 0, -bMinY);
            scene.add(houseGroup);
            sceneElements.push(houseGroup);
            
            const extWallMat = new THREE.MeshStandardMaterial({color: 0xefedea, roughness: 0.9});
            const intWallMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 1.0});
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff, transmission: 0.9, opacity: 1, transparent: true,
                roughness: 0.1, ior: 1.5, thickness: 0.1
            });
            const floorWoodMat = new THREE.MeshStandardMaterial({color: 0x8b5a2b, roughness: 0.6});
            const floorTileMat = new THREE.MeshStandardMaterial({color: 0xe2e8f0, roughness: 0.2});
            const floorCarpetMat = new THREE.MeshStandardMaterial({color: 0x4a5568, roughness: 0.9});

            // In walk mode we always want full-height walls (can't see over / walk through).
            const wallHeight = (viewMode === 'walk') ? 11 : (config.cutaway ? 4.5 : 11);
            
            function buildWallSegment(x1, y1, x2, y2, type) {
                if (type === 'none') return null;
                let length = Math.hypot(x2 - x1, y2 - y1);
                let cx = (x1 + x2) / 2;
                let cy = (y1 + y2) / 2;
                let angle = Math.atan2(y2 - y1, x2 - x1);
                
                let hasDoor = type === 'interior' && length >= 4.5;
                let hasWindow = type === 'exterior' && length >= 5;
                
                let group = new THREE.Group();
                group.position.set(cx, 0, -cy);
                group.rotation.y = angle;
                
                let thickness = type === 'exterior' ? 0.8 : 0.5;
                let mat = type === 'exterior' ? extWallMat : intWallMat;
                
                function addBlock(w, h, d, px, py, pz, m) {
                    let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
                    mesh.position.set(px, py, pz);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData.collider = true; // used to build wall collision boxes in walk mode
                    group.add(mesh);
                }
                
                if (type === 'glass') {
                    addBlock(length, wallHeight, thickness, 0, wallHeight/2, 0, glassMat);
                } else if (hasDoor) {
                    let doorW = 3;
                    let doorH = 7;
                    let w1 = (length - doorW) / 2;
                    addBlock(w1, wallHeight, thickness, -length/2 + w1/2, wallHeight/2, 0, mat);
                    addBlock(w1, wallHeight, thickness, length/2 - w1/2, wallHeight/2, 0, mat);
                    if (wallHeight > doorH) {
                        addBlock(doorW, wallHeight - doorH, thickness, 0, doorH + (wallHeight - doorH)/2, 0, mat);
                    }
                } else if (hasWindow) {
                    let winW = 4;
                    let winH = 4;
                    let winY = 3;
                    let w1 = (length - winW) / 2;
                    addBlock(w1, wallHeight, thickness, -length/2 + w1/2, wallHeight/2, 0, mat);
                    addBlock(w1, wallHeight, thickness, length/2 - w1/2, wallHeight/2, 0, mat);
                    addBlock(winW, winY, thickness, 0, winY/2, 0, mat);
                    if (wallHeight > winY + winH) {
                        let topH = wallHeight - (winY + winH);
                        addBlock(winW, topH, thickness, 0, winY + winH + topH/2, 0, mat);
                    }
                    addBlock(winW, winH, 0.1, 0, winY + winH/2, 0, glassMat);
                } else {
                    addBlock(length, wallHeight, thickness, 0, wallHeight/2, 0, mat);
                }
                return group;
            }

            const xs = [0, W/3, 2*W/3, W];
            const ys = [0, H/3, 2*H/3, H];

            // ---- Vaastu-driven cell assignment ----
            // Build a 3x3 grid of room definitions from VAASTU_ROOMS + facing.
            // If Vaastu auto-layout is off, fall back to the legacy fixed labels.
            const cellRoom = [[null,null,null],[null,null,null],[null,null,null]];
            if (config.vaastuStrict) {
                VAASTU_ROOMS.forEach(r => {
                    const cell = zoneToCell(r.zone, config.facing);
                    if (cell) cellRoom[cell[0]][cell[1]] = r;
                });
            } else {
                // Legacy fallback grid (indices [i][j], i=front..rear)
                const legacy = [
                    [{name:'Master Bed',floor:'carpet',furniture:'bed'},{name:'Bedroom 3',floor:'tile',furniture:'bed'},{name:'Kitchen',floor:'tile',furniture:'kitchen'}],
                    [{name:'Bedroom 2',floor:'carpet',furniture:'bed'},{name:'Family Hall',floor:'tile',furniture:'sofa'},{name:'Family Hall',floor:'tile',furniture:null}],
                    [{name:'Office',floor:'carpet',furniture:null},{name:'Lounge',floor:'wood',furniture:null},{name:'Pooja',floor:'tile',furniture:'mandir'}]
                ];
                for(let i=0;i<3;i++) for(let j=0;j<3;j++) cellRoom[i][j]=legacy[i][j];
            }

            // The front row's outward wall gets the main entrance (door).
            // Horizontal walls (run along x, separate rows i)
            for(let i=0; i<=3; i++) {
                for(let j=0; j<3; j++) {
                    let type = (i === 0 || i === 3) ? 'exterior' : 'interior';
                    let wall = buildWallSegment(xs[j], ys[i], xs[j+1], ys[i], type);
                    if (wall) houseGroup.add(wall);
                }
            }
            // Vertical walls (run along y, separate cols j)
            for(let j=0; j<=3; j++) {
                for(let i=0; i<3; i++) {
                    let type = (j === 0 || j === 3) ? 'exterior' : 'interior';
                    let wall = buildWallSegment(xs[j], ys[i], xs[j], ys[i+1], type);
                    if (wall) houseGroup.add(wall);
                }
            }

            const floorMatFor = { wood: floorWoodMat, tile: floorTileMat, carpet: floorCarpetMat };

            // Floors — material chosen per assigned room.
            for(let i=0; i<3; i++) {
                for(let j=0; j<3; j++) {
                    const room = cellRoom[i][j];
                    let mat = (room && floorMatFor[room.floor]) ? floorMatFor[room.floor] : floorWoodMat;

                    let fw = xs[j+1] - xs[j];
                    let fh = ys[i+1] - ys[i];
                    let cx = xs[j] + fw/2;
                    let cy = ys[i] + fh/2;
                    
                    const floorGeom = new THREE.PlaneGeometry(fw, fh);
                    floorGeom.rotateX(-Math.PI/2);
                    const floor = new THREE.Mesh(floorGeom, mat);
                    floor.position.set(cx, 0.05, -cy);
                    floor.receiveShadow = true;
                    houseGroup.add(floor);
                }
            }

            // Furniture Helpers
            function addBed(x, y, angle) {
                const g = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1, 6.5), new THREE.MeshStandardMaterial({color: 0x4a3b2c}));
                frame.position.y = 0.5;
                g.add(frame);
                const matt = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 6), new THREE.MeshStandardMaterial({color: 0xffffff}));
                matt.position.y = 1.2;
                g.add(matt);
                const pillow = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 1.5), new THREE.MeshStandardMaterial({color: 0xefedea}));
                pillow.position.set(0, 1.8, -2);
                g.add(pillow);
                g.position.set(x, 0, -y);
                g.rotation.y = angle;
                houseGroup.add(g);
            }

            function addSofa(x, y) {
                const g = new THREE.Group();
                const m = new THREE.MeshStandardMaterial({color: 0x2b6cb0});
                const base = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 3), m);
                base.position.y = 0.75;
                g.add(base);
                const back = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 0.8), m);
                back.position.set(0, 2, -1.1);
                g.add(back);
                const ext = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 4), m);
                ext.position.set(-2, 0.75, 1.5);
                g.add(ext);
                g.position.set(x, 0, -y);
                houseGroup.add(g);
            }

            function addKitchenIsland(x, y) {
                const g = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 3), new THREE.MeshStandardMaterial({color: 0x2d3748}));
                base.position.y = 1.5;
                g.add(base);
                const top = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.2, 3.5), new THREE.MeshStandardMaterial({color: 0xf7fafc, roughness: 0.1}));
                top.position.y = 3.1;
                g.add(top);
                g.position.set(x, 0, -y);
                houseGroup.add(g);
            }

            function addPoojaMandir(x, y) {
                const m = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 2), new THREE.MeshStandardMaterial({color: 0xedf2f7, roughness:0.1, metalness:0.2}));
                m.position.set(x, 2.5, -y);
                houseGroup.add(m);
            }

            // ---- Data-driven furniture + room labels from the Vaastu assignment ----
            const furnitureFns = {
                bed: (cx, cy) => addBed(cx, cy, 0),
                sofa: (cx, cy) => addSofa(cx, cy),
                kitchen: (cx, cy) => addKitchenIsland(cx, cy),
                mandir: (cx, cy) => addPoojaMandir(cx, cy)
            };
            roomsData = [];
            for(let i=0; i<3; i++) {
                for(let j=0; j<3; j++) {
                    const room = cellRoom[i][j];
                    if (!room) continue;
                    const cx = (xs[j] + xs[j+1]) / 2;
                    const cy = (ys[i] + ys[i+1]) / 2;
                    if (room.furniture && furnitureFns[room.furniture]) {
                        furnitureFns[room.furniture](cx, cy);
                    }
                    roomsData.push({
                        name: room.name,
                        zone: room.zone || '',
                        x: cx, y: cy,
                        w: xs[j+1] - xs[j],
                        h: ys[i+1] - ys[i]
                    });
                }
            }

            // Roof
            if (!config.cutaway) {
                const roofGeom = new THREE.BoxGeometry(W + 4, 1, H + 4);
                const roofMat = new THREE.MeshStandardMaterial({color: 0x4a5568, roughness: 0.9});
                const roof = new THREE.Mesh(roofGeom, roofMat);
                roof.position.set(W/2, wallHeight + 0.5, -H/2);
                roof.castShadow = true;
                houseGroup.add(roof);
            }

            // Room labels (show name + Vaastu zone) — driven by roomsData built above.
            roomsData.forEach(r => {
                r.absX = bMinX + r.x;
                r.absY = bMinY + r.y;
                const label = r.zone ? `${r.name} · ${r.zone}` : r.name;
                addHtmlLabel(label, new THREE.Vector3(r.absX, wallHeight + 1.5, -r.absY), 'bg-gray-900/80 text-gray-100 border-gray-600');
            });

            // 4. Vaastu Chakra Layers
            if (config.showVaastu) {
                const cx = centroid.x;
                const cy = centroid.y;
                const R = Math.max(config.front, config.left, config.right, config.rear) * 0.75; 
                
                const vaastuGroup = new THREE.Group();
                const lineMat = new THREE.LineDashedMaterial({
                    color: 0xb794f4, linewidth: 2, dashSize: 2, gapSize: 1, transparent: true, opacity: 0.8
                });
                
                const angles = [
                    {a: 0, n: 'East'}, {a: 22.5, n: 'ENE'}, {a: 45, n: 'NE (Ishanya)'}, 
                    {a: 67.5, n: 'NNE'}, {a: 90, n: 'North'}, {a: 112.5, n: 'NNW'}, 
                    {a: 135, n: 'NW (Vayavya)'}, {a: 157.5, n: 'WNW'}, {a: 180, n: 'West'},
                    {a: 202.5, n: 'WSW'}, {a: 225, n: 'SW (Nairuthi)'}, {a: 247.5, n: 'SSW'},
                    {a: 270, n: 'South'}, {a: 292.5, n: 'SSE'}, {a: 315, n: 'SE (Agneya)'},
                    {a: 337.5, n: 'ESE'}
                ];
                
                // Draw Brahmasthan center point
                const centerGeom = new THREE.CircleGeometry(2, 32);
                centerGeom.rotateX(-Math.PI/2);
                const centerMat = new THREE.MeshBasicMaterial({color: 0xd6bcfa, transparent: true, opacity: 0.5});
                const centerMesh = new THREE.Mesh(centerGeom, centerMat);
                centerMesh.position.set(cx, 0.2, -cy);
                vaastuGroup.add(centerMesh);
                
                angles.forEach(ang => {
                    const rad = ang.a * Math.PI / 180;
                    const px = cx + R * Math.cos(rad);
                    const pz = -cy - R * Math.sin(rad);
                    
                    const geom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(cx, 0.2, -cy),
                        new THREE.Vector3(px, 0.2, pz)
                    ]);
                    const line = new THREE.Line(geom, lineMat);
                    line.computeLineDistances(); // required for dashed lines
                    vaastuGroup.add(line);
                    
                    addHtmlLabel(ang.n, new THREE.Vector3(px, 0.5, pz), 'text-purple-100 bg-purple-900/80 border-purple-500');
                });
                
                scene.add(vaastuGroup);
                sceneElements.push(vaastuGroup);
            }

            // 5. Structural Grid
            columnsData = [];
            if (config.showGrid) {
                const gridGroup = new THREE.Group();
                const colGeom = new THREE.CylinderGeometry(0.6, 0.6, 12, 16);
                const colMat = new THREE.MeshStandardMaterial({color: 0x718096, roughness: 0.7});
                
                const span = 15; // 15' span
                let minX = Math.min(...plotPoints.map(p=>p.x));
                let maxX = Math.max(...plotPoints.map(p=>p.x));
                let minY = Math.min(...plotPoints.map(p=>p.y));
                let maxY = Math.max(...plotPoints.map(p=>p.y));
                
                for(let x = minX; x <= maxX; x += span) {
                    for(let y = minY; y <= maxY; y += span) {
                        if (pointInPoly({x, y}, plotPoints)) {
                            const mesh = new THREE.Mesh(colGeom, colMat);
                            mesh.position.set(x, 6, -y);
                            mesh.castShadow = true;
                            gridGroup.add(mesh);
                            columnsData.push({x, y});
                        }
                    }
                }
                scene.add(gridGroup);
                sceneElements.push(gridGroup);
            }

            // 6. Rebuild wall collision boxes for walk mode.
            rebuildWallBoxes();
        }

        // Collect world-space bounding boxes of all wall blocks for collision.
        function rebuildWallBoxes() {
            wallBoxes = [];
            scene.updateMatrixWorld(true);
            sceneElements.forEach(el => {
                if (!el.traverse) return;
                el.traverse(child => {
                    if (child.isMesh && child.userData && child.userData.collider) {
                        const box = new THREE.Box3().setFromObject(child);
                        wallBoxes.push(box);
                    }
                });
            });
        }

        // Returns true if a camera at (x, z) would overlap any wall (within PLAYER_RADIUS).
        function collidesAt(x, z) {
            for (let i = 0; i < wallBoxes.length; i++) {
                const b = wallBoxes[i];
                // Only walls that exist at eye level matter; all our walls span the floor, so skip Y test.
                if (x + PLAYER_RADIUS > b.min.x && x - PLAYER_RADIUS < b.max.x &&
                    z + PLAYER_RADIUS > b.min.z && z - PLAYER_RADIUS < b.max.z) {
                    return true;
                }
            }
            return false;
        }

        // Move the first-person camera with WASD, blocking movement into walls (slide along axis).
        function updateWalk(delta) {
            const speed = (move.run ? 26 : 13); // feet per second
            const damping = 10;

            walkVelocity.x -= walkVelocity.x * damping * delta;
            walkVelocity.z -= walkVelocity.z * damping * delta;

            const dir = new THREE.Vector3();
            dir.z = Number(move.forward) - Number(move.back);
            dir.x = Number(move.right) - Number(move.left);
            dir.normalize();

            if (move.forward || move.back) walkVelocity.z += dir.z * speed * delta;
            if (move.left || move.right) walkVelocity.x += dir.x * speed * delta;

            const obj = pointerControls.getObject();
            const before = obj.position.clone();

            // Apply movement in camera-local space, then test collision per-axis so we can slide.
            pointerControls.moveRight(walkVelocity.x * delta);
            if (collidesAt(obj.position.x, obj.position.z)) {
                obj.position.x = before.x;
                walkVelocity.x = 0;
            }
            const afterX = obj.position.clone();
            pointerControls.moveForward(walkVelocity.z * delta);
            if (collidesAt(obj.position.x, obj.position.z)) {
                obj.position.z = afterX.z;
                walkVelocity.z = 0;
            }

            obj.position.y = EYE_HEIGHT; // stay at eye height (single-storey walk)
        }

        // ---- View mode switching ----
        function setViewMode(mode) {
            if (mode === viewMode) return;
            viewMode = mode;

            const dollBtn = document.getElementById('btn-mode-dollhouse');
            const walkBtn = document.getElementById('btn-mode-walk');
            const overlay = document.getElementById('walk-overlay');
            const crosshair = document.getElementById('crosshair');

            if (mode === 'walk') {
                dollBtn.className = 'py-2 rounded-lg text-sm font-semibold transition-colors bg-gray-700 text-gray-300 hover:bg-gray-600';
                walkBtn.className = 'py-2 rounded-lg text-sm font-semibold transition-colors bg-emerald-600 text-white';

                controls.enabled = false;
                if (!pointerControls) initPointerControls();

                // Rebuild with full-height walls + fresh collision boxes.
                updatePlot();
                placeWalker();

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                crosshair.classList.remove('hidden');
            } else {
                dollBtn.className = 'py-2 rounded-lg text-sm font-semibold transition-colors bg-blue-600 text-white';
                walkBtn.className = 'py-2 rounded-lg text-sm font-semibold transition-colors bg-gray-700 text-gray-300 hover:bg-gray-600';

                if (pointerControls && pointerControls.isLocked) pointerControls.unlock();
                controls.enabled = true;
                camera.position.set(40, 150, 80);
                controls.target.set(40, 0, -40);

                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                crosshair.classList.add('hidden');

                updatePlot(); // restore cutaway/normal walls
            }
        }

        function initPointerControls() {
            pointerControls = new THREE.PointerLockControls(camera, renderer.domElement);
            scene.add(pointerControls.getObject());

            const overlay = document.getElementById('walk-overlay');
            overlay.addEventListener('click', () => {
                if (viewMode === 'walk') pointerControls.lock();
            });
            pointerControls.addEventListener('lock', () => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            });
            pointerControls.addEventListener('unlock', () => {
                if (viewMode === 'walk') {
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                }
            });

            document.addEventListener('keydown', onWalkKey(true));
            document.addEventListener('keyup', onWalkKey(false));
        }

        // Place the walker just outside the front entrance, looking into the plot.
        // Plot front edge is at y=0 (world z=0); the house extends into +y (world -z).
        // Standing at world z = +8 (south of the front) and looking toward -z faces the house.
        function placeWalker() {
            const obj = pointerControls.getObject();
            obj.position.set(centroid.x, EYE_HEIGHT, 8);
            walkVelocity.set(0, 0, 0);
            // Face north, into the plot.
            camera.rotation.set(0, Math.PI, 0);
        }

        function onWalkKey(isDown) {
            return function (e) {
                switch (e.code) {
                    case 'ArrowUp': case 'KeyW': move.forward = isDown; break;
                    case 'ArrowDown': case 'KeyS': move.back = isDown; break;
                    case 'ArrowLeft': case 'KeyA': move.left = isDown; break;
                    case 'ArrowRight': case 'KeyD': move.right = isDown; break;
                    case 'ShiftLeft': case 'ShiftRight': move.run = isDown; break;
                }
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (viewMode === 'walk' && pointerControls) {
                updateWalk(delta);
            } else if (controls) {
                controls.update();
            }

            renderer.render(scene, camera);
            
            // Sync HTML Labels with 3D space
            const tempV = new THREE.Vector3();
            htmlLabels.forEach(label => {
                tempV.copy(label.pos);
                tempV.project(camera);
                
                // Hide if behind camera
                if (tempV.z > 1) {
                    label.el.style.opacity = '0';
                    label.el.style.pointerEvents = 'none';
                    return;
                }
                
                const x = (tempV.x *  0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
                
                label.el.style.opacity = '1';
                label.el.style.left = `${x}px`;
                label.el.style.top = `${y}px`;
            });
        }

        // CAD Exporter Logic
        function exportDXF() {
            let dxf = `0\nSECTION\n2\nENTITIES\n`;
            
            function addLine(x1, y1, x2, y2, layer) {
                dxf += `0\nLINE\n8\n${layer}\n10\n${x1.toFixed(4)}\n20\n${y1.toFixed(4)}\n30\n0.0\n11\n${x2.toFixed(4)}\n21\n${y2.toFixed(4)}\n31\n0.0\n`;
            }
            
            // Plot Boundaries
            for(let i=0; i<plotPoints.length; i++){
                let p1 = plotPoints[i];
                let p2 = plotPoints[(i+1)%plotPoints.length];
                addLine(p1.x, p1.y, p2.x, p2.y, 'BOUNDARY');
            }
            
            function addText(x, y, height, str, layer) {
                dxf += `0\nTEXT\n8\n${layer}\n10\n${x.toFixed(4)}\n20\n${y.toFixed(4)}\n30\n0.0\n40\n${height.toFixed(2)}\n1\n${str}\n`;
            }

            // Room Boundaries + labels (name and Vaastu zone) for the engineer.
            roomsData.forEach(r => {
                let x1 = r.absX - r.w/2;
                let x2 = r.absX + r.w/2;
                let y1 = r.absY - r.h/2;
                let y2 = r.absY + r.h/2;
                
                addLine(x1, y1, x2, y1, 'ROOMS');
                addLine(x2, y1, x2, y2, 'ROOMS');
                addLine(x2, y2, x1, y2, 'ROOMS');
                addLine(x1, y2, x1, y1, 'ROOMS');

                const label = r.zone ? `${r.name} (${r.zone})` : r.name;
                addText(x1 + 1, r.absY, 1.5, label, 'ROOM_LABELS');
            });

            // Grid Columns
            if (config.showGrid) {
                columnsData.forEach(c => {
                    let s = 1.0; // small cross
                    addLine(c.x - s, c.y, c.x + s, c.y, 'COLUMNS');
                    addLine(c.x, c.y - s, c.x, c.y + s, 'COLUMNS');
                });
            }

            dxf += `0\nENDSEC\n0\nEOF\n`;

            downloadBlob(new Blob([dxf], { type: 'application/dxf' }), 'architectural_layout.dxf');
        }

        // ---------- Shared helpers ----------
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function safeName() {
            const n = (document.getElementById('in-model-name').value || 'land-model').trim();
            return n.replace(/[^a-z0-9\-_]+/gi, '_').toLowerCase();
        }

        // Shoelace area of the plot polygon (sq.ft).
        function plotArea() {
            if (!plotPoints || plotPoints.length < 3) return 0;
            let a = 0;
            for (let i = 0; i < plotPoints.length; i++) {
                const p1 = plotPoints[i];
                const p2 = plotPoints[(i + 1) % plotPoints.length];
                a += p1.x * p2.y - p2.x * p1.y;
            }
            return Math.abs(a) / 2;
        }

        const DIR_NAME = { N: 'North', E: 'East', S: 'South', W: 'West' };

        // ---------- Phase 4: Engineer summary sheet ----------
        function exportEngineerSheet() {
            const rows = roomsData.map(r => {
                const area = (r.w * r.h);
                return `<tr><td>${r.name}</td><td>${r.zone || '-'}</td><td>${r.w.toFixed(1)} × ${r.h.toFixed(1)}</td><td>${area.toFixed(0)}</td></tr>`;
            }).join('');
            const totalRoomArea = roomsData.reduce((s, r) => s + r.w * r.h, 0);

            const html = `<!DOCTYPE html><html><head><meta charset="utf-8">

<style>
 body{font-family:Arial,Helvetica,sans-serif;margin:32px;color:#111}

<h2>Plot</h2>
<div class="grid">
 <div class="k">Front (${DIR_NAME[config.facing]}-facing)</div><div class="v">${config.front} ft</div>

 <div class="k">Plot area</div><div class="v">${plotArea().toFixed(0)} sq.ft</div>
 <div class="k">Green / setback zone</div><div class="v">${config.greenArea} sq.ft</div>
 <div class="k">Facing</div><div class="v">${DIR_NAME[config.facing]}</div>
</div>
<h2>Rooms</h2>
<table>
 <thead><tr><th>Room</th><th>Vaastu zone</th><th>Approx size (ft)</th><th>Area (sq.ft)</th></tr></thead>

</table>

</body></html>`;
            downloadBlob(new Blob([html], { type: 'text/html' }), `${safeName()}_engineer_sheet.html`);
            setStatus('Engineer sheet exported (open & print to PDF).');
        }

        // ---------- Phase 4: Vaastu compliance report ----------
        function exportVaastuReport() {
            // Expected Vaastu placements to check the current layout against.
            const expected = {
                'Pooja': 'NE', 'Kitchen': 'SE', 'Master Bed': 'SW',
                'Living / Hall': 'N', 'Dining': 'S', 'Bath / Utility': 'NW'
            };
            const rows = roomsData.map(r => {
                const want = expected[r.name];
                let status = '—';
                if (want) status = (r.zone === want)
                    ? '<span style="color:#127a2b;font-weight:bold">✓ Compliant</span>'
                    : `<span style="color:#b00">⚠ Expected ${want}</span>`;
                return `<tr><td>${r.name}</td><td>${r.zone || '-'}</td><td>${status}</td></tr>`;
            }).join('');

            const html = `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Vaastu Report — ${escapeHtml(document.getElementById('in-model-name').value || 'Land Model')}</title>
<style>

<p class="sub">Model: <b>${escapeHtml(document.getElementById('in-model-name').value || 'Untitled')}</b> · Plot faces <b>${DIR_NAME[config.facing]}</b> · Generated ${new Date().toLocaleString()}</p>

 <li>Toilets / utility — North-West / West</li>
 <li>Center (Brahmasthan) — kept open / light</li>
</ul>
<p class="note">Guidance based on traditional Vastu Purush Mandala principles and is provided for discussion with a Vaastu consultant. It is not a substitute for professional Vaastu or architectural advice. Print to PDF to share.</p>
</body></html>`;
            downloadBlob(new Blob([html], { type: 'text/html' }), `${safeName()}_vaastu_report.html`);
            setStatus('Vaastu report exported (open & print to PDF).');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // ---------- Save current 3D view as PNG ----------
        function saveSnapshot() {
            // Render once to be sure the buffer is current, then read the canvas.
            renderer.render(scene, camera);
            renderer.domElement.toBlob(blob => {
                if (blob) {
                    downloadBlob(blob, `${safeName()}_view.png`);
                    setStatus('View saved as PNG.');
                } else {
                    setStatus('Could not capture the view.', true);
                }
            }, 'image/png');
        }
    </script>
</body>
